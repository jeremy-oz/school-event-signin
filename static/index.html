<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign-In</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>School Event Sign-In</h1>
    <div class="card">
      <h2>Students</h2>
      <p class="muted">Generate your personal QR code. Show it to the teacher each event.</p>
      <a href="/me"><button>Open my QR code</button></a>
    </div>
    <div class="card">
      <h2>Teachers</h2>
      <a href="/scan"><button>Scan QR codes</button></a>
      <a href="/log"><button class="secondary">View attendance log</button></a>
    </div>
  </main>
</body>
</html>
